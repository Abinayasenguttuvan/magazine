<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackly Magazine Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
min-height:100vh;
overflow-x:hidden;
overflow-y:auto;
color:#fff;
position:relative;
}
.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:-2}
.top-bar{position:absolute;top:0;left:0;width:100%;padding:20px 30px}
.home-btn{color:#fff;text-decoration:none;font-weight:600}
.page-wrapper{
display:flex;
gap:50px;
align-items:center;
justify-content:center;
min-height:auto;
padding:120px 30px 80px;
max-width:1400px;
margin:auto;
}
.login-container{width:430px;background:rgba(255,255,255,.08);backdrop-filter:blur(18px);padding:35px;border-radius:24px;border:1px solid rgba(255,255,255,.15)}
.logo{text-align:center}
.logo img{width:120px;animation:float 3s infinite}
@keyframes float{50%{transform:translateY(-8px)}}
h1{text-align:center;margin:10px 0}
.subtitle{text-align:center;color:#ddd;margin-bottom:20px}
.input-box{position:relative;margin-bottom:15px}
.input-box input{width:100%;padding:14px 45px;border:none;border-radius:12px;background:rgba(255,255,255,.12);color:#fff}
.left-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%)}
.eye-icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer}
.btn,.social-btn{width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer}
.btn{background:#e11d48;color:#fff;font-weight:700}
.social-btn{background:rgba(255,255,255,.12);color:#fff;margin-top:10px}
.extra-links{display:flex;justify-content:space-between;margin:15px 0}
.extra-links a,.home-btn{color:#fff}
.or{text-align:center;margin:15px 0}
#error{text-align:center;color:#ff6b6b;margin-top:10px}
.news-side{flex:1}
.ticker{background:#111;padding:12px;border-radius:10px;}
.track{white-space:nowrap;animation:ticker 18s linear infinite}
@keyframes ticker{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:20px}
.grid img{width:100%;height:250px;object-fit:cover;border-radius:18px;animation:floatimg 5s infinite}
@keyframes floatimg{50%{transform:translateY(-10px)}}
@media(max-width:1024px){.page-wrapper{flex-direction:column}.login-container{width:100%;max-width:500px}}
@media(max-width:768px){

.page-wrapper{
flex-direction:column;
padding:100px 15px 60px;
}

.login-container{
width:100%;
max-width:500px;
}

.news-side{
width:100%;
}

}
html{
scroll-behavior:smooth;
overflow-y:scroll;
}
html{
scroll-behavior:smooth;
}

body{
min-height:100vh;
overflow-x:hidden;
overflow-y:auto;
}
</style>
</head>
<body>
<video autoplay muted loop playsinline class="bg-video">
<source src="./disaster.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="top-bar"><a class="home-btn" href="index.html"><i class="fa fa-home"></i> Home</a></div>

<div class="page-wrapper">
<div class="login-container">
<div class="logo"><img src="./white.webp" alt="logo"></div>
<h1>Stackly Magazine</h1>
<p class="subtitle">Log in or create an account</p>

<div class="input-box">
<i class="fa fa-envelope left-icon"></i>
<input type="email" id="email" placeholder="Enter Email">
</div>

<div class="input-box">
<i class="fa fa-lock left-icon"></i>
<input type="password" id="password" placeholder="Enter Password">
<i class="fa-solid fa-eye-slash eye-icon" onclick="togglePassword()"></i>
</div>

<button class="btn" onclick="validateLogin()">Submit</button>

<div class="extra-links">
<a href="signup.html">Signup</a>
<a href="404.html">Forgot Password?</a>
</div>

<p id="error"></p>

<div class="or">OR</div>

<button class="social-btn" onclick="location.href='404.html'"><i class="fab fa-google"></i> Continue with Google</button>
<button class="social-btn" onclick="location.href='404.html'"><i class="fab fa-facebook-f"></i> Continue with Facebook</button>
<button class="social-btn" onclick="location.href='404.html'"><i class="fab fa-apple"></i> Continue with Apple</button>
</div>

<div class="news-side">
<div class="ticker"><div class="track">BREAKING NEWS • WORLD • BUSINESS • TECHNOLOGY • SPORTS • ENTERTAINMENT • BREAKING NEWS •</div></div>
<div class="grid">
<img src="./tsunami.webp">
<img src="./tax.webp">
<img src="./politics15.webp">
<img src="./politics12.webp">
</div>
</div>
</div>

<script>
function togglePassword(){
const p=document.getElementById('password');
const i=document.querySelector('.eye-icon');
if(p.type==='password'){p.type='text';i.classList.replace('fa-eye-slash','fa-eye');}
else{p.type='password';i.classList.replace('fa-eye','fa-eye-slash');}
}
function validateLogin(){
let e=document.getElementById('email').value.trim();
let p=document.getElementById('password').value.trim();
let err=document.getElementById('error');
if(e===''||p===''){err.innerHTML='Please fill details correctly';return;}
window.location.href='404.html';
}
</script>
</body>
</html>
